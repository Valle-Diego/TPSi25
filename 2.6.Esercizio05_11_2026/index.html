<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertitore valute</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Convertitore valute</h1>

  <form id="modulo">
    <label for="quantita">Quantità</label>
    <input id="quantita" type="number" min="0.01" step="any" required>

    <label for="partenza">Da</label>
    <select id="partenza" required>
      <option value="">Scegli una valuta</option>
    </select>

    <label for="arrivo">A</label>
    <select id="arrivo" required>
      <option value="">Scegli una valuta</option>
    </select>

    <button type="submit">Converti</button>
  </form>

  <p id="stato">Caricamento cambi…</p>
  <p id="risultato"></p>

  <script src="script.js"></script>
</body>
</html>
